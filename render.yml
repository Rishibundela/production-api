# render.yaml - Infrastructure as a code for Render
services:
  - type: web
    name: production-langgraph-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install uv && ub sync --frozen --no-dev
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "20/minute"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: MAX_RETRIES
        value: "3"
      - key: PRIMARY_MODEL
        value: gpt-4
      - key: SECONDARY_MODEL
        value: gpt-3.5-turbo
      - key: GEMINI_API_KEY
        sync: false # Must be set manually - NEVER commit secrets to version control
      - key: LANGCHAIN_API_KEY
        sync: false # Must be set manually 
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: production-api
    healthCheckPath: /health
    autoDeploy: true
